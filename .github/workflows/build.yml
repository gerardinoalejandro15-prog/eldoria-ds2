name: Build Eldoria DS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar libnds
        run: dkp-pacman -S --needed --noconfirm libnds

      - name: Compilar Eldoria
        run: make

      - name: Guardar ROM
        uses: actions/upload-artifact@v4
        with:
          name: Eldoria-DS
          path: eldoria.nds
